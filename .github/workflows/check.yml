# Plays HELLBOUND in a headless browser on every pull request and every push
# to main. A red X on GitHub means the game crashed or a control broke.
# This does not deploy anything: GitHub Pages still publishes from main.
name: Game check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Uses the Google Chrome that GitHub's machines already have, so no browser download.
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.48.2
      - name: Serve the game
        run: python3 -m http.server 8000 --bind 127.0.0.1 &
      - name: Play it
        run: node tests/smoke.mjs
